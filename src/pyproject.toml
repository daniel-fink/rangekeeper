[project]
name = "Rangekeeper"
version = "0.8.71"
description = "A Python library assisting financial modelling in real estate asset & development planning, decision-making, cashflow forecasting, and scenario analysis."
authors = [
    { name = "Daniel Fink", email = "danfink@mit.edu" }
]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.10, <3.14"

dependencies = [
    "jsonschema>=4.26,<5",
    "rfc3339-validator>=0.1.4,<0.2",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pint>=0.24",
    "pyxirr>=0.10.7,<0.11",
    "scipy>=1.12",
    "networkx>=3.1",
    "py-moneyed>=3.0",
    "tabulate>=0.9",
    "specklepy>=2.21",
    "numba>=0.61",
    "multiprocess>=0.70.18",
    "seaborn>=0.13",
    "pyvis>=0.3.2",
    "plotly>=6.0",
    "aenum>=3.0",
    "numpy-financial>=1.0",
    "pytest>=8.0",
    "black>=25.0",
    "pandas-stubs~=2.3.2",
]

[project.optional-dependencies]
layout = ["z3-solver==5.1.0.0"]
calculations = ["polars>=1.44,<2", "numpy>=1.24", "scipy>=1.12", "pint>=0.24", "pyxirr>=0.10.7,<0.11"]
pandas = ["pandas>=2.2"]
execution = ["pyomo==6.10.1", "highspy==1.15.1"]
yaml = ["PyYAML>=6.0.2,<7"]
workflow = ["openpyxl>=3.1.5,<4", "PyYAML>=6.0.2,<7"]
excel = ["openpyxl>=3.1.5,<4", "PyYAML>=6.0.2,<7"]

[tool.ruff.format]
preview = true  # Uses Black's experimental formatting rules

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rangekeeper*"]
exclude = ["*.node_modules*", "*.client*"]

[tool.setuptools.package-data]
"rangekeeper" = ["py.typed", "_currencies.json"]
"rangekeeper._schema" = ["*.json"]
"rangekeeper.adapters.cytoscape" = ["assets/*.js", "assets/*.css", "assets/*.html", "assets/vendor/*.js", "assets/vendor/*.LICENSE", "assets/vendor/*.json"]

"rangekeeper.adapters.cytoscape.layout" = ["*.mzn"]

"rangekeeper.adapters.speckle" = ["contract.json"]
