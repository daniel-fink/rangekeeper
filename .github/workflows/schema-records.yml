name: Schema records
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      PYSTOW_HOME: ${{ runner.temp }}/pystow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tools/schema/requirements.txt mypy==1.18.2 pint==0.24.4 'pytest>=8,<9' 'setuptools>=77'
      - run: python tools/schema/generate.py --check
      - run: python tools/schema/typecheck.py
      - run: python tools/schema/verify_native.py
      - run: PYTHONPATH=src python -m pytest --noconftest src/tests/test_records.py src/tests/test_domain_model.py src/tests/test_domain_specification.py src/tests/test_validation_composition.py src/tests/test_domain_run.py src/tests/test_domain_io.py src/tests/test_model_graph.py -q
      - run: python tools/schema/verify_install.py
      - name: Existing conformance suites
        run: |
          for suite in validate native_roundtrip expressions formulations models specifications runs; do
            python schema/checks/$suite.py
          done
  scalar-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r tools/schema/requirements.txt pint==0.24.4 'pytest>=8,<9' 'setuptools>=77' pyomo==6.10.1 highspy==1.15.1 'openpyxl>=3.1.5,<4'
      - run: python -m pip install --no-deps ./src
      - run: PYTHONPATH=src python -m pytest --noconftest src/tests/test_execution.py src/tests/test_model_consumers.py src/tests/test_workflow.py src/tests/test_workflow_shared.py src/tests/test_workflow_boundaries.py src/tests/test_workflow_formats.py -q
      - run: python tools/schema/verify_install.py --execution-python "$(which python)" --workflow-python "$(which python)"
