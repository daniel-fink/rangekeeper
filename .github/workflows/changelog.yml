name: Changelog

# A separate workflow, so that label events rerun only this check. It has no
# concurrency group: a cancelled run would leave a cancelled required check.
on:
  pull_request:
    branches: [develop, main, support/0.8]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Check for a changelog fragment
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        env:
          BASE: ${{ github.base_ref }}
        run: uv run --locked --only-group changelog towncrier check --compare-with "origin/$BASE"
      - name: Check that the changelog renders
        run: uv run --locked --only-group changelog towncrier build --draft --version check > /dev/null
