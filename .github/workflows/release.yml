name: Release

# A version tag builds, checks and publishes one release:
#   v0.8.N                    from support/0.8 (maintenance line)
#   v1.X.YaN, v1.X.YbN, v1.X.YrcN  pre-releases from develop or main
#   v1.X.Y                    final releases from main
# A pull request that changes this workflow or its notes script runs the build
# and checks only. The procedure and the one-time PyPI and GitHub setup are in
# docs/contributing/releasing.md on develop and RELEASING.md on support/0.8.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release_notes.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      package-dir: ${{ steps.plan.outputs.package-dir }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All branches and tags: the tag must be on its release branch.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Check the tag against its release line
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then dir=.; else dir=src; fi
          if [ "$EVENT" != push ] || [ "$REF_TYPE" != tag ]; then
            echo "Dry run: build and check only."
            {
              echo "version="
              echo "package-dir=$dir"
              echo "prerelease=false"
              echo "latest=false"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prerelease=false
          if [[ "$TAG" =~ ^v0\.8\.[0-9]+$ ]]; then
            branches="support/0.8"
          elif [[ "$TAG" =~ ^v1\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
            branches="develop main"
            prerelease=true
          elif [[ "$TAG" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            branches="main"
          else
            echo "::error::Tag $TAG is not v0.8.N, v1.X.Y or a v1 pre-release (aN, bN, rcN)."
            exit 1
          fi

          found=""
          for branch in $branches; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
              found="$branch"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::error::Tag $TAG ($GITHUB_SHA) is not on: $branches."
            exit 1
          fi
          echo "Tag $TAG is on $found; package directory: $dir."

          # A 0.8.x release is the latest GitHub Release only until 1.0.0 exists.
          latest=true
          if [ "$prerelease" = true ]; then
            latest=false
          elif [[ "$TAG" == v0.8.* ]] && git tag -l 'v1.*' | grep -Eqv '(a|b|rc)[0-9]+$'; then
            latest=false
          fi

          {
            echo "version=${TAG#v}"
            echo "package-dir=$dir"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Version tools that read Git history need the full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build the sdist and wheel
        env:
          PACKAGE_DIR: ${{ needs.plan.outputs.package-dir }}
        run: python -m build --outdir dist "$PACKAGE_DIR"
      - name: Check the files and their version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          twine check --strict dist/*
          if [ -n "$VERSION" ]; then
            test -f "dist/rangekeeper-$VERSION.tar.gz" || {
              echo "::error::No sdist for version $VERSION. Make the package version match the tag."
              exit 1
            }
            test -f "dist/rangekeeper-$VERSION-py3-none-any.whl" || {
              echo "::error::No wheel for version $VERSION. Make the package version match the tag."
              exit 1
            }
          fi
      - name: Attest the build provenance
        id: attest
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Keep the attestation bundle
        if: needs.plan.outputs.publish == 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p attestation
          cp "$BUNDLE" "attestation/rangekeeper-$VERSION.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.publish == 'true'
        with:
          name: attestation
          path: attestation/
          if-no-files-found: error

  smoke:
    name: Import (Python ${{ matrix.python }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the wheel and import the package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "
          import importlib.metadata, os, rangekeeper
          found = importlib.metadata.version('rangekeeper')
          expected = os.environ['VERSION']
          print('rangekeeper', found)
          assert not expected or found == expected, (found, expected)
          "

  pypi:
    name: Publish to PyPI
    needs: [plan, smoke]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/rangekeeper/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Trusted publishing; the action also uploads PEP 740 attestations.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: [plan, pypi]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation
          path: attestation
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          changes="$(python3 .github/scripts/release_notes.py "$VERSION")"
          args=(--verify-tag --title "Rangekeeper $VERSION" --latest="$LATEST")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          if [ -z "$changes" ]; then
            # No changelog section: GitHub generates notes after this text.
            args+=(--generate-notes)
          fi
          {
            if [ -n "$changes" ]; then echo "$changes"; fi
            echo
            echo "## Verification"
            echo
            echo "PyPI: https://pypi.org/project/rangekeeper/$VERSION/"
            echo
            echo "Each file has a GitHub build provenance attestation:"
            echo
            echo '```sh'
            echo "gh attestation verify rangekeeper-$VERSION-py3-none-any.whl --repo $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          gh release create "$TAG" dist/* attestation/* --notes-file notes.md "${args[@]}"
