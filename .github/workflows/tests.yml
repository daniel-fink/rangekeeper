name: Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv run --locked --only-group lint ruff check --output-format github .
      - run: uv run --locked --only-group lint ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Plots render off screen; the suite needs no display.
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      # All extras: the suite imports Matplotlib, Polars, Pyomo/HiGHS and Bundle IO.
      - run: uv sync --locked --all-extras
      - run: uv run --locked pytest -q -rs
