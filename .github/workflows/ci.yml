name: CI

on:
  pull_request:
    branches: [develop, main, support/0.8]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check_baseline.py reads pyproject.toml at the merge base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - run: uv run --locked --only-group lint ruff check --output-format github .
      - run: uv run --locked --only-group lint ruff format --check .
      - name: Check that the structure baseline and the mypy override do not grow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: uv run --locked --only-group lint python tools/ci/check_baseline.py --base "origin/$BASE"

  layers:
    name: layers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      # The contracts in pyproject.toml read the source; no extra is necessary.
      - run: uv sync --locked --no-default-groups --group layers
      - run: uv run --locked --no-sync lint-imports

  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      # The extras provide the third-party types that mypy reads.
      - run: uv sync --locked --all-extras --no-default-groups --group types
      - run: uv run --locked --no-sync mypy

  generated:
    name: generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      # The pinned schema environment, plus the runtime imports of the native
      # round trip and the typing conformance check.
      - run: |
          uv venv .schema-env
          uv pip install --python .schema-env -r tools/schema/requirements.txt \
            "mypy==1.18.2" "py-moneyed>=3,<4" "pint>=0.24"
      - run: .schema-env/bin/python tools/schema/generate.py --check
      - run: .schema-env/bin/python tools/schema/check_generator.py
      - run: .schema-env/bin/python tools/schema/generate_csharp.py --check
      - run: .schema-env/bin/python tools/schema/verify_native.py
      - run: .schema-env/bin/python tools/schema/typecheck.py

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tools/version.py reads the setuptools-scm version.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      # The Model library and the fixture runner build without Rhino. The
      # Components project needs the Rhino assemblies and is not built here.
      - run: dotnet restore examples/grasshopper/Tests/Tests.csproj --locked-mode
      - run: |
          uv sync --locked --all-extras
          version=$(uv run --locked --no-sync python tools/version.py --dotnet)
          dotnet build examples/grasshopper/Tests/Tests.csproj --no-restore -p:Version="$version"
      - name: Round trip the cross-language fixtures through C#
        run: |
          uv run --locked --no-sync python tools/schema/cross_language.py prepare "$RUNNER_TEMP/cross-language"
          dotnet examples/grasshopper/Tests/bin/Debug/net8.0/Tests.dll \
            "$RUNNER_TEMP/cross-language/python.json" "$RUNNER_TEMP/cross-language/csharp.json"
          uv run --locked --no-sync python tools/schema/cross_language.py check "$RUNNER_TEMP/cross-language"

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/docs/check.py

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both environments install Rangekeeper from this checkout (setuptools-scm).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      # Zensical and mkdocstrings build the site; the walkthrough environment
      # runs the lessons. The build does not publish.
      - run: uv sync --locked --all-extras --no-default-groups --group docs
      - run: uv sync --project examples/walkthrough --locked --no-default-groups --group test
      - run: uv run --locked --no-sync python tools/docs/site.py build
        env:
          RK_DESIGN_MODE: fixture
          RK_PATH_COUNT: "4"

  walkthrough:
    name: walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The walkthrough installs Rangekeeper from this checkout (setuptools-scm).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --project examples/walkthrough --locked --no-default-groups --group test
      - run: python3 examples/walkthrough/viewer/check_manifest.py
      # Helper tests, lesson checks and each lesson in a fresh kernel, then its
      # conversion for the docs site. Fixture design data and few market paths.
      - run: uv run --project examples/walkthrough --locked --no-sync pytest examples/walkthrough -q -rs
        env:
          RK_DESIGN_MODE: fixture
          RK_PATH_COUNT: "4"

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # All extras: the suite imports Polars, Pyomo/HiGHS and Bundle IO.
      - run: uv sync --locked --all-extras
      - run: uv run --locked pytest -q -rs

  extras:
    name: extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra: [core, bundle, calculations, execution, yaml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      # Install the wheel with one extra and no lock file: the newest versions in
      # the declared ranges.
      - name: Install the wheel with one extra
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          uv build --wheel --out-dir dist
          wheel=$(ls "$PWD"/dist/*.whl)
          uv venv "$RUNNER_TEMP/venv"
          if [ "$EXTRA" = core ]; then spec="rangekeeper @ file://$wheel"
          else spec="rangekeeper[$EXTRA] @ file://$wheel"; fi
          uv pip install --python "$RUNNER_TEMP/venv" "$spec"
      - name: Check the extra outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          EXTRA: ${{ matrix.extra }}
        run: venv/bin/python "$GITHUB_WORKSPACE/tools/ci/check_extra.py" "$EXTRA"

  wheel:
    name: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm reads the tags and the distance from them.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uvx check-wheel-contents dist/*.whl
      - name: Verify the installed record boundary and optional slices
        run: |
          uv sync --locked --all-extras --no-default-groups
          python=$(uv run --locked --no-sync python -c "import sys; print(sys.executable)")
          uv run --locked --no-sync --with pip python tools/schema/verify_install.py \
            --wheel dist/*.whl --execution-python "$python" \
            --financial-python "$python" --tables-python "$python"
      - name: Run the tests against the installed wheel
        run: |
          wheel=$(ls "$PWD"/dist/*.whl)
          extras=bundle,calculations,execution,yaml
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" "rangekeeper[$extras] @ file://$wheel" \
            pytest numpy-financial ./examples
          # Outside the checkout, the tests import the installed package, not src/.
          mkdir -p "$RUNNER_TEMP/wheel-tests"
          cp -R tests "$RUNNER_TEMP/wheel-tests/tests"
          cp -R examples "$RUNNER_TEMP/wheel-tests/examples"
          cd "$RUNNER_TEMP/wheel-tests"
          "$RUNNER_TEMP/venv/bin/python" -c "import rangekeeper, sys; assert 'site-packages' in rangekeeper.__file__, rangekeeper.__file__"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -rs -p no:cacheprovider tests
