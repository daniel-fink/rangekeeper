[project]
name = "Rangekeeper"
version = "0.10.0.dev7"
description = "Algorithmic modelling for project finance"
authors = [
    { name = "Daniel Fink", email = "danfink@mit.edu" }
]
license = "MPL-2.0"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10, <3.14"

dependencies = [
    "py-moneyed==3.0",
    "jsonschema>=4.26,<5",
    "rfc3339-validator>=0.1.4,<0.2",
    "pint>=0.24",
    "ipykernel>=7.3.0",
]

[project.urls]
Repository = "https://github.com/daniel-fink/rangekeeper"
Documentation = "https://github.com/daniel-fink/rangekeeper#readme"
Issues = "https://github.com/daniel-fink/rangekeeper/issues"

[project.optional-dependencies]
bundle = ["pyarrow==23.0.1", "duckdb==1.4.3"]
calculations = [
    "polars>=1.44,<2",
    "numpy>=1.24",
    "scipy>=1.12",
    "pyxirr>=0.10.7,<0.11",
]
visualisation = [
    "matplotlib>=3.10",
    "plotly>=6.0",
    "networkx>=3.1",
    "pyvis>=0.3.2",
]
execution = ["numpy>=1.24", "pyomo==6.10.1", "highspy==1.15.1"]
yaml = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    "pytest>=8.0",
    "numpy-financial>=1.0",
    "rangekeeper-examples",
]
lint = ["ruff>=0.17.2,<0.18"]

[tool.uv.sources]
rangekeeper-examples = { path = "examples", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    # Captured research evidence stays as recorded.
    "docs",
    # Generated by tools/schema/generate.py; regenerate instead of editing.
    "src/rangekeeper/schema/enums.py",
    "src/rangekeeper/schema/native.py",
    "src/rangekeeper/schema/records.py",
]

[tool.ruff.lint]
select = ["F", "I", "B", "UP", "D"]
ignore = [
    # Magic methods and __init__ inherit their meaning from the class docstring.
    "D105",
    "D107",
    # PEP 695 aliases and type parameters change runtime objects; adopt them
    # with strict typing.
    "UP040",
    "UP047",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-bugbear]
# Immutable values: safe as argument defaults.
extend-immutable-calls = [
    "typing.cast",
    "rangekeeper.run.execution.acceptance.Tolerances",
]

[tool.ruff.lint.isort]
known-first-party = ["rangekeeper", "rangekeeper_examples"]
# Rhino's .NET namespace; case-insensitive file systems confuse it with src/grasshopper.
known-third-party = ["Grasshopper"]

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the public package only.
"!src/rangekeeper/**" = ["D"]
# Nested helpers run only inside the loop iteration that defines them (B023).
"src/rangekeeper/io/bundle.py" = ["B023"]
"src/rangekeeper/schema/runtime.py" = ["B023"]
"schema/checks/specification_composition_cases.py" = ["B023"]
# Typing fixtures bind values only so that mypy checks their types.
"tools/schema/typing_*.py" = ["F841"]
# Adapters leave the core package before 1.0 (ADR-010); format only.
"src/rangekeeper/visualisation/**" = ["F", "B", "UP", "D"]
"src/rangekeeper/io/speckle.py" = ["F", "B", "UP", "D"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rangekeeper", "rangekeeper.*"]
namespaces = false
exclude = ["*.node_modules*", "*.client*"]

[tool.setuptools.package-data]
"rangekeeper" = ["py.typed"]
"rangekeeper.schema" = ["*.json"]
"rangekeeper.io" = ["speckle_contract.json"]
"rangekeeper.visualisation" = ["assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
