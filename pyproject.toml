[tool.towncrier]
name = "Rangekeeper"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/daniel-fink/rangekeeper/issues/{issue})"
underlines = ["", "", ""]
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "packaging"
name = "Packaging"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Engineering"
showcontent = true

[tool.mypy]
# Strict for the whole package (ADR-018). The override below lists the
# packages that are not yet strict.
python_version = "3.12"
files = ["src/rangekeeper"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Strict typing ratchet (#399). These packages are not yet strict. The PR that
# makes a package pass removes it from this list. Do not add a package.
module = [
    "rangekeeper.finance.*",
    "rangekeeper.profile",
    "rangekeeper.quantity",
    "rangekeeper.shared.*",
    "rangekeeper.schema.*",
    "rangekeeper.execution.*",
    "rangekeeper.run.*",
    "rangekeeper.specification.*",
    "rangekeeper.flow.*",
    "rangekeeper.io.*",
    "rangekeeper.model.*",
    "rangekeeper.market.*",
]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
implicit_reexport = true
extra_checks = false

[[tool.mypy.overrides]]
# Dependencies without type information.
module = ["pyarrow.*", "pyomo.*", "scipy.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Until the first v1.* tag, develop builds as a 1.0.0a1 development version.
# Older 0.x tags are on the 0.8 support line and must not count here.
fallback_version = "1.0.0a1.dev0"

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v1.*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rangekeeper", "rangekeeper.*"]
namespaces = false

[tool.setuptools.package-data]
"rangekeeper" = ["py.typed"]
"rangekeeper.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/codemod/tests", "tools/upgrade/tests"]
pythonpath = ["src"]
