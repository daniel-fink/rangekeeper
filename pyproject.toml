[project]
name = "rangekeeper"
dynamic = ["version"]
description = "Algorithmic modelling for project finance"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Fink" }]
maintainers = [{ name = "Daniel Fink", email = "danfink@mit.edu" }]
requires-python = ">=3.12"
keywords = [
    "real estate",
    "project finance",
    "financial modelling",
    "cash flow",
    "discounted cash flow",
    "scenario analysis",
    "real options",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "py-moneyed>=3.0,<4",
    "jsonschema>=4.26,<5",
    "rfc3339-validator>=0.1.4,<0.2",
    "pint>=0.24",
    # Windows has no system time zone database for zoneinfo.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/daniel-fink/rangekeeper"
# Placeholder until the versioned documentation site is published (ADR-018).
Documentation = "https://github.com/daniel-fink/rangekeeper/tree/develop/docs#readme"
Repository = "https://github.com/daniel-fink/rangekeeper"
Issues = "https://github.com/daniel-fink/rangekeeper/issues"
Changelog = "https://github.com/daniel-fink/rangekeeper/blob/develop/CHANGELOG.md"

[project.optional-dependencies]
bundle = ["pyarrow>=23.0.1", "duckdb>=1.4.3,<2"]
calculations = [
    "polars>=1.44,<2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyxirr>=0.10.7,<0.11",
]
execution = ["numpy>=1.26", "pyomo>=6.10.1,<7", "highspy>=1.15.1,<2"]
yaml = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = [
    { include-group = "changelog" },
    { include-group = "lint" },
    { include-group = "types" },
    { include-group = "notebook" },
    { include-group = "codemod" },
    { include-group = "layers" },
    "pytest>=8.0",
    "numpy-financial>=1.0",
    "rangekeeper-examples",
]
lint = ["ruff>=0.17.2,<0.18"]
changelog = ["towncrier>=26.9,<27"]
types = ["mypy>=2.4,<3", "types-PyYAML>=6.0.12", "types-jsonschema>=4.26"]
notebook = ["ipykernel>=7.3.0"]
codemod = ["libcst>=1.8,<2", "PyYAML>=6.0.2,<7"]
layers = ["import-linter>=2.15,<3"]

# The 1.0 layers (ADR-010). A module imports only from its own layer or a lower
# layer, in the order below. TYPE_CHECKING imports are excluded: they name types,
# and do not run. Each ignored import gives its reason.
[tool.importlinter]
root_package = "rangekeeper"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "The 12 layers of ADR-010"
type = "layers"
containers = ["rangekeeper"]
layers = [
    "io",
    "execution",
    "run",
    "specification",
    "model",
    "finance",
    "market",
    "flow",
    "profile",
    "duration",
    "quantity",
    "schema",
    "shared",
]
# Upward imports that a planned change removes. Each entry names its issue;
# remove the entry with the import.
ignore_imports = [
    # #303: profile classes and Flow.from_profile replace extrapolate and distribute.
    "rangekeeper.profile -> rangekeeper.flow",
    # #298, #299: Dynamics, generate and Paths replace the scenario plan, which
    # samples, captures and replays market paths into a Model.
    "rangekeeper.market._replay -> rangekeeper.model",
    "rangekeeper.market.components -> rangekeeper.model",
    "rangekeeper.market.contracts -> rangekeeper.model.scope",
    "rangekeeper.market.generation -> rangekeeper.model",
    "rangekeeper.market.view -> rangekeeper.model",
]

[tool.uv]
# Rebuild the editable install when the git version changes (setuptools-scm).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
rangekeeper-examples = { path = "examples", editable = true }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    # Captured research evidence stays as recorded.
    "docs",
    # Generated by tools/schema/generate.py; regenerate instead of editing.
    "src/rangekeeper/schema/checks.py",
    "src/rangekeeper/schema/enums.py",
    "src/rangekeeper/schema/records.py",
]

[tool.ruff.lint]
select = ["F", "I", "B", "UP", "D"]
ignore = [
    # Magic methods and __init__ inherit their meaning from the class docstring.
    "D105",
    "D107",
    # PEP 695 aliases and type parameters change runtime objects; adopt them
    # with strict typing.
    "UP040",
    "UP047",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-bugbear]
# Immutable values: safe as argument defaults.
extend-immutable-calls = [
    "typing.cast",
    "rangekeeper.execution.acceptance.Tolerances",
]

[tool.ruff.lint.isort]
known-first-party = ["rangekeeper", "rangekeeper_examples"]

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the public package only.
"!src/rangekeeper/**" = ["D"]
# Nested helpers run only inside the loop iteration that defines them (B023).
"src/rangekeeper/io/bundle.py" = ["B023"]
"src/rangekeeper/schema/runtime.py" = ["B023"]
"schema/checks/specification_composition_cases.py" = ["B023"]
# Typing fixtures bind values only so that mypy checks their types.
"tools/schema/typing_*.py" = ["F841"]

[tool.towncrier]
name = "Rangekeeper"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/daniel-fink/rangekeeper/issues/{issue})"
underlines = ["", "", ""]
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecation"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "packaging"
name = "Packaging"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Engineering"
showcontent = true

[tool.mypy]
# A passing baseline; strict mode for rangekeeper.* follows the typed public
# API (ADR-018).
python_version = "3.12"
files = ["src/rangekeeper"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
# Dependencies without type information.
module = ["pyarrow.*", "pyomo.*", "scipy.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77.0.3", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Until the first v1.* tag, develop builds as a 1.0.0a1 development version.
# Older 0.x tags are on the 0.8 support line and must not count here.
fallback_version = "1.0.0a1.dev0"

[tool.setuptools_scm.scm.git]
describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v1.*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rangekeeper", "rangekeeper.*"]
namespaces = false

[tool.setuptools.package-data]
"rangekeeper" = ["py.typed"]
"rangekeeper.schema" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/codemod/tests"]
pythonpath = ["src"]
