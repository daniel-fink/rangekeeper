[project]
name = "rangekeeper"
dynamic = ["version"]
description = "Algorithmic modelling for project finance"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Fink" }]
maintainers = [{ name = "Daniel Fink", email = "danfink@mit.edu" }]
requires-python = ">=3.12"
keywords = [
    "real estate",
    "project finance",
    "financial modelling",
    "cash flow",
    "discounted cash flow",
    "scenario analysis",
    "real options",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "py-moneyed>=3.0,<4",
    "jsonschema>=4.26,<5",
    "rfc3339-validator>=0.1.4,<0.2",
    "pint>=0.24",
    # Windows has no system time zone database for zoneinfo.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/daniel-fink/rangekeeper"
# Placeholder until the versioned documentation site is published (ADR-018).
Documentation = "https://github.com/daniel-fink/rangekeeper/tree/develop/docs#readme"
Repository = "https://github.com/daniel-fink/rangekeeper"
Issues = "https://github.com/daniel-fink/rangekeeper/issues"
Changelog = "https://github.com/daniel-fink/rangekeeper/blob/develop/CHANGELOG.md"

[project.optional-dependencies]
bundle = ["pyarrow>=23.0.1", "duckdb>=1.4.3,<2"]
calculations = [
    "polars>=1.44,<2",
    "numpy>=1.26",
    "scipy>=1.12",
    "pyxirr>=0.10.7,<0.11",
]
execution = ["numpy>=1.26", "pyomo>=6.10.1,<7", "highspy>=1.15.1,<2"]
yaml = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = [
    { include-group = "changelog" },
    { include-group = "lint" },
    { include-group = "types" },
    { include-group = "notebook" },
    { include-group = "codemod" },
    { include-group = "layers" },
    "pytest>=8.0",
    "numpy-financial>=1.0",
    "rangekeeper-examples",
]
lint = ["ruff>=0.17.2,<0.18"]
changelog = ["towncrier>=26.9,<27"]
types = ["mypy>=2.4,<3", "types-PyYAML>=6.0.12", "types-jsonschema>=4.26"]
notebook = ["ipykernel>=7.3.0"]
codemod = ["libcst>=1.8,<2", "PyYAML>=6.0.2,<7"]
layers = ["import-linter>=2.15,<3"]
# The docs site (ADR-018): tools/docs/site.py builds and serves it.
docs = [
    "zensical>=0.0.73,<0.1",
    "mkdocstrings>=1.0.8,<2",
    "mkdocstrings-python>=2.0.10,<3",
]
# Zensical's fork of mike publishes the versioned sites. It is not on PyPI, so
# uv takes it from git at a fixed commit. Only publication needs it.
versions = [{ include-group = "docs" }, "mike"]

# The 1.0 layers (ADR-010). A module imports only from its own layer or a lower
# layer, in the order below. TYPE_CHECKING imports are excluded: they name types,
# and do not run. Each ignored import gives its reason.
[tool.importlinter]
root_package = "rangekeeper"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "The layers of ADR-010: 12 numbered layers, with money and quantity"
type = "layers"
containers = ["rangekeeper"]
layers = [
    "io",
    "execution",
    "run",
    "specification",
    "model",
    "finance",
    "market",
    "flow",
    "profile",
    "duration",
    "quantity",
    "money",
    "schema",
    "shared",
]
# Upward imports that a planned change removes. Each entry names its issue;
# remove the entry with the import.
ignore_imports = [
    # #298, #299: Dynamics, generate and Paths replace the scenario plan, which
    # samples, captures and replays market paths into a Model.
    "rangekeeper.market._replay -> rangekeeper.model",
    "rangekeeper.market.components -> rangekeeper.model",
    "rangekeeper.market.contracts -> rangekeeper.model._scope",
    "rangekeeper.market.generation -> rangekeeper.model",
    "rangekeeper.market.view -> rangekeeper.model",
]

[tool.uv]
# Rebuild the editable install when the git version changes (setuptools-scm).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
rangekeeper-examples = { path = "examples", editable = true }
mike = { git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    # Captured research evidence stays as recorded.
    "docs",
    # Generated by tools/schema/generate.py; regenerate instead of editing.
    "src/rangekeeper/schema/checks.py",
    "src/rangekeeper/schema/enums.py",
    "src/rangekeeper/schema/records.py",
]

[tool.ruff.lint]
select = [
    "F",
    "I",
    "B",
    "UP",
    "D",
    # Structure guardrails (#399). See docs/contributing/coding-conventions.md.
    "C901",  # function complexity
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PLR0917",  # too many positional arguments
    "PLC0415",  # import outside the top level (#331)
    "ANN001",  # missing argument type
    "ANN002",  # missing *args type
    "ANN003",  # missing **kwargs type
    "ANN201",  # missing return type, public function
    "ANN202",  # missing return type, private function
    "ANN204",  # missing return type, special method
    "ANN205",  # missing return type, staticmethod
    "ANN206",  # missing return type, classmethod
]
ignore = [
    # Magic methods and __init__ inherit their meaning from the class docstring.
    "D105",
    "D107",
    # PEP 695 aliases and type parameters change runtime objects; adopt them
    # with strict typing.
    "UP040",
    "UP047",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 3
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-annotations]
# `__init__` needs no `-> None` when one argument has a type, as in mypy.
mypy-init-return = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-bugbear]
# Immutable values: safe as argument defaults.
extend-immutable-calls = [
    "typing.cast",
    "rangekeeper.execution.acceptance.Tolerances",
]

[tool.ruff.lint.isort]
known-first-party = ["rangekeeper", "rangekeeper_examples"]

[tool.ruff.lint.per-file-ignores]
# Docstring, structure and annotation rules apply to the public package only.
"!src/rangekeeper/**" = ["D", "C901", "PLR09", "PLC0415", "ANN"]
# Typing fixtures bind values only so that mypy checks their types.
"tools/schema/typing_*.py" = ["F841"]
"schema/checks/specification_composition_cases.py" = ["B023"]
# Structure baseline (#399): the findings in the code when the guardrails
# landed (#400). Do not add entries; CI fails when a pull request adds one
# (tools/ci/check_baseline.py). When you fix a hotspot, remove its codes here.
# B023: nested helpers run only inside the loop iteration that defines them.
"src/rangekeeper/execution/attempt.py" = ["PLR0913"]
"src/rangekeeper/execution/backends/_worker.py" = ["PLC0415", "ANN001", "ANN202"]
"src/rangekeeper/execution/compiler.py" = ["C901", "PLR0911", "PLR0912"]
