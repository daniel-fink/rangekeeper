[project]
name = "RangekeeperWalkthrough"
version = "0.1"
description = "Walkthrough documentation of the Rangekeeper library (https://github.com/daniel-fink/rangekeeper)"
authors = [{ name = "Daniel Fink", email = "danfink@mit.edu" }]
license = "MPL-2.0"
readme = { text = "See docs/guides/walkthroughs.md in the Rangekeeper repository.", content-type = "text/plain" }
requires-python = ">=3.12, <3.14"
dependencies = [
    "jupyter>=1.1",
    "jupyter-book>=2,<3",
    "notebook>=7.5",
    "plotly>=6.5",
    "rangekeeper[calculations,execution,visualisation]>=0.9",
    "scipy-stubs>=1.16",
    "rangekeeper-examples",
]

[tool.uv.sources]
rangekeeper = { path = "../.." }
rangekeeper-examples = { path = "..", editable = true }
