<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
<title id="title">Current Rangekeeper objects and numerical calculations</title><desc id="desc">Model holds definitions, system and provenance. System holds entities, assemblies and relationships. Characteristics refer to values. Geometry is associated externally. Numerical flows and streams are calculated separately in this chapter.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#596f83"/></marker></defs>
<rect width="1000" height="535" rx="14" fill="#f4f7fa"/>
<g font-family="Arial,sans-serif" fill="#17334b">
<text x="35" y="40" font-size="24" font-weight="bold">Record the project; calculate its economics</text>
<rect x="35" y="68" width="615" height="370" rx="10" fill="white" stroke="#9eafbf"/>
<text x="60" y="100" font-size="21" font-weight="bold">Model — one immutable revision</text>
<rect x="60" y="120" width="170" height="62" rx="7" fill="#dfebf3"/><text x="76" y="144" font-size="17">Definitions</text><text x="76" y="166" font-size="13">Classifications, measures</text>
<rect x="245" y="120" width="175" height="62" rx="7" fill="#dfebf3"/><text x="262" y="144" font-size="17">System</text><text x="262" y="166" font-size="13">Objects and relationships</text>
<rect x="435" y="120" width="190" height="62" rx="7" fill="#dfebf3"/><text x="452" y="144" font-size="17">Provenance</text><text x="452" y="166" font-size="13">Sources and interpretation</text>
<path d="M 332 184 L 332 209" stroke="#596f83" marker-end="url(#arrow)"/>
<rect x="60" y="215" width="273" height="88" rx="7" fill="#e8f1e9"/><text x="77" y="243" font-size="18">Entity / Assembly</text><text x="77" y="266" font-size="14">Identity, name, classification</text><text x="77" y="287" font-size="14">Assembly also declares a grouping</text>
<rect x="355" y="215" width="270" height="88" rx="7" fill="#e8f1e9"/><text x="372" y="243" font-size="18">Relationship</text><text x="372" y="266" font-size="14">Source, target, classification</text><text x="372" y="287" font-size="14">e.g. spatiallyContains or services</text>
<path d="M 194 305 L 194 331" stroke="#596f83" marker-end="url(#arrow)"/>
<rect x="60" y="337" width="565" height="75" rx="7" fill="#f8efd9"/><text x="77" y="364" font-size="18">Characteristics → Value records</text><text x="77" y="390" font-size="14">e.g. GFA with m² units, or a recorded use property</text>
<rect x="690" y="68" width="275" height="143" rx="10" fill="#e8eef6" stroke="#9eafbf"/><text x="712" y="99" font-size="20" font-weight="bold">Associated geometry</text><text x="712" y="130" font-size="15">Original Speckle transport archive</text><text x="712" y="155" font-size="15">Breps, meshes and context</text><text x="712" y="180" font-size="15">Linked by recorded identities</text>
<path d="M 652 150 L 685 150" stroke="#596f83" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<rect x="690" y="250" width="275" height="188" rx="10" fill="#e8f1e9" stroke="#9eafbf"/><text x="712" y="282" font-size="20" font-weight="bold">This chapter calculates</text><text x="712" y="317" font-size="17">Flow: quantities over time</text><text x="712" y="346" font-size="17">Stream: named flows together</text><text x="712" y="380" font-size="15">Area × assumptions → income</text><text x="712" y="406" font-size="15">Income + costs → cash flow</text>
<path d="M 650 374 L 684 374" stroke="#596f83" marker-end="url(#arrow)"/>
<text x="35" y="477" font-size="17">The captured Model stays unchanged. Derived flows retain the contributing object identities.</text>
<text x="35" y="506" font-size="15" fill="#526b80">Notebook 03 will introduce equations and Specifications for forward and inverse questions.</text>
</g></svg>