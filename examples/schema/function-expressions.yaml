definitions:
  measures:
  - id: 9b32a207-5ddf-5e6b-82b4-f6e94c87e329
    code: annual_rate
    name: Annual rate
    units: 1/year
functions:
- id: 36cc8bb4-b118-5cc1-bab7-93ef64ac416d
  code: flow.total
  name: Flow total
  version: '1'
  parameters:
  - name: flow
    domain:
      kind: flow
    kind: positional_or_named
    required: true
  result:
    kind: measurement
  semantics: Sum the dated amounts of the Flow. An empty Flow returns zero in the
    Flow declared units. Missing amounts remain unresolved.
  unit_rule: The result uses the Flow amount units.
- id: 8add1e97-a74d-5d17-8ae1-9140e87adece
  code: flow.irr.annual
  name: Annual internal rate of return
  version: '1'
  parameters:
  - name: flow
    domain:
      kind: flow
    kind: positional_or_named
    required: true
  - name: guess
    domain:
      kind: number
    kind: named_only
    required: false
  result:
    kind: measurement
    measure: 9b32a207-5ddf-5e6b-82b4-f6e94c87e329
  semantics: For equally spaced annual cash flows, determine r such that sum(c[t]
    / (1 + r * one_year)^t) = 0, with r greater than -1/year. No root or multiple
    admissible roots is an error. A guess is only a numerical starting point; when
    omitted use 0.1 as the annual-rate magnitude. This contract does not specify a
    root-finding algorithm or prove uniqueness.
  unit_rule: The result is an annual rate in 1/year; the dimensionless guess is its
    magnitude under that annual convention.
