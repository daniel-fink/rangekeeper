# Decisions of #255 that change API shapes, not names. They are listed in the
# upgrade guide. The codemod does not apply them.
notes:
  - topic: Quantity text in API arguments
    status: agreed
    source: "#255 D13, D16, D17"
    note: Arguments take unit text such as `"7 % pa"`; `per` divides and `pa` means per year.
  - topic: Execution configuration
    status: agreed
    source: "ADR-013, #128"
    note: >-
      `Executor(store, backend=, units=, tolerances=)` becomes
      `execute(specification=, store=, config=ExecutionConfig(backend=, units=,
      tolerances=))`. `ExecutionConfig` also holds the default `limits` and
      the `backend_options`.
  - topic: Execution calls
    status: agreed
    source: "#255 D14, #410"
    note: >-
      The arguments of `rk.execution.solve`, `execute`, `assemble`,
      `assemble_batch`, `make_candidate` and `verify` are keyword-only:
      `solve(specification, store)` is now `solve(specification=,
      resolver=)`, and so are the stage calls `resolve_cases(specification=,
      resolver=)`, `validate(composition=, resolver=, units=)`,
      `bind_roles(validation=)` and `build_problem(binding=, limits=)`, the
      rule calls `rk.execution.rule.evaluate(rules=, model=)` and
      `observe(model=, at=, bindings=)`, `Overlay(resolver=, models=, runs=)`
      and `rk.run.validate(run=, resolver=)`. A backend declares
      `def solve(self, *, problem, limits, remaining, options)`. The records of `rk.execution`, `rk.execution.backends`
      and `rk.execution.rule` take keyword arguments only, for example
      `Limits(time_limit=)`, `Tolerances(absolute=, relative=)` and
      `BackendResult(termination=, candidate=)`.
  - topic: Resample options
    status: agreed
    source: "#399, #405"
    note: >-
      `resample(method=)` takes one `ResampleMethod` for each line, and the
      weighting of a mean is part of the method: `MEAN` or `ELAPSED_MEAN`.
      `split(periods=)` or `split(frequency=)` divides amounts over shorter
      Periods and takes no `method=` or `missing=`.
  - topic: Flow and Stream options
    status: agreed
    source: "#399, #406"
    note: >-
      Each argument chooses one thing. `flow.check(resolved=True)` is
      `flow.require_resolved()`. `clean(remove_zeroes=True)` is
      `clean().drop_zeroes()`; `extent()` takes no flag. `round(mode=)` takes a
      `rangekeeper.money.RoundingMode`. `collapse(on=)` takes a date or a
      `PeriodTiming` (was `timing=`). `integrate(day_count=)` is
      `integrate_time(day_count=)`. `from_periods` and `from_events` take no
      `dates=` or `ids=`: make the `Movement` records. `multiply` and `scale`
      follow `*`, so an unresolved amount gives an unresolved product.
      `Stream.select(value_ids=)` is `Stream.select_values(ids)`. The `missing`
      and `join` policies live on the Stream: `Stream(..., missing=, join=)` or
      `stream.with_policy(missing=, join=)`; `aggregate`, `sum`, `min`, `max`
      and `resample` take no `missing=` or `join=`. `sum(timing=)` is
      `stream.dated(timing=).sum()`.
  - topic: Keyword-only arguments
    status: agreed
    source: "#255 D14"
    note: Every Rangekeeper call names its arguments.
  - topic: Model authoring and builder names
    status: agreed
    source: "#255 D6, D16, D18"
    note: "`rk.Model(name=)`, `model.edit()`, `ModelDraft.add_entity(code=)` and entity handles. `Model(record, units=)` is removed: `rk.Model(name=)` makes an empty Model, and `Model.create(...)` or `Model.from_data(...)` take complete records (#141, #281)."
  - topic: Specification calls
    status: agreed
    source: "#255 D7, D8"
    note: "`fix`, `free`, `cases`, `across` and `parameters` each return a new Specification; unfixed values are free. `model.specify(name=)` makes one. `fix(target, quantity, id=, model=, ids=, recorded=)` is now `fix(key=quantity)`, or `fix({target: quantity})` for a dotted path, a UUID or a mapping of Movement UUIDs; `free(target, id=, model=, ids=)` is now `free(*targets)`. The Specification keeps its Model: pass `Specification(record=, model=, resolver=)` for a record. `recorded=True` is removed: fix the recorded Quantities explicitly (#144). `fix` also takes Quantity text and a number for a ratio; a number for a value with other units raises `UnitError`, not `TypeError`. `specify` and each call record as unknowns the values that the equations use and that nothing fixes, so `free` is needed only to release a fixed value. `roles` lists the role of each value as an `rk.specification.Role` (#290)."
  - topic: Loan payment
    status: agreed
    source: "#255 D19"
    note: "`rangekeeper.finance.payment(principal=, rate=, term=, frequency=)` (#167)."
  - topic: Funding accounts
    status: agreed
    source: "#255 D2, D23"
    note: There is no account class and no account declaration. A balance is `cumulative()` of a Flow.
  - topic: Growth and distribution profiles
    status: agreed
    source: "#255 D12"
    note: "`rk.profile.Constant`, `Linear`, `Compounding`, `Uniform` and `SCurve` with `rk.flow.Flow.from_profile(profile=, periods=, initial= or total=)` replace `extrapolate`, `distribute` and `GrowthMethod` (#303)."
  - topic: Market paths
    status: agreed
    source: "#255 D29, D31"
    note: "`rk.market.Dynamics`, `rk.market.generate` and `rk.market.Paths` replace the scenario plan and the trend and cycle kernels (#298, #299)."
  - topic: Fixed words are enums
    status: agreed
    source: "#255 D26"
    note: "Diagnostic codes are `rk.errors.Code` (#154); \"the event does not happen\" is `rk.duration.NEVER`; `Role`, `DecisionResult`, `Status` and `Direction` are enums. Words that the data defines stay strings."
  - topic: Date shift
    status: agreed
    source: "#255 D14, D25, #389"
    note: "`rk.duration.shift(value, by=)` is now `shift(on=, by=)`. `rk.duration.DateValue` (a date or `NEVER`) names its type. `shift` moves a date value by a length; `offset(value=, frequency=, count=, month_roll=)` moves a date by whole steps of a Frequency."
  - topic: Calendar grids
    status: agreed
    source: "#399, #403"
    note: "`containing_period(value, *, frequency=, week_start=, year_start_month=, origin=)` is now `containing_period(*, on=, grid=)`. The grid is `DayGrid()`, `WeekGrid(starts=calendar.Day.MONDAY)`, `MonthGrid(frequency=, year_starts=calendar.Month.JANUARY)` for months, quarters, half-years and years, or `MultiYearGrid(frequency=, origin=)` for bienniums, quinquenniums and decades. A grid takes only the choices that apply to it; a week grid takes no origin."
  - topic: Keyword-only arguments in quantity, money and duration
    status: agreed
    source: "#410 D14"
    note: "Name each argument: `UnitSystem(currencies=, definitions=)`, `UnitSystem.convert(quantity=, to=)`, `register(name=, definition=, aliases=)`, `alias(alias=, unit=)`, `rk.money.round(amount=, currency=, places=, mode=)`, `rk.duration.offset(value=, frequency=, count=, month_roll=)` and `cover(periods=, name=)`. A natural pair stays positional: `compatible(left, right)`, `multiply(left, right)`, `divide(numerator, denominator)`, `count_steps(start, end, frequency=)` and `year_fraction(start, end, convention=)`."
  - topic: Bundle options
    status: agreed
    source: "#411, #422"
    note: "`rk.io.bundle.write(root=, model=, documents=, resolver=, geometry=, parquet=)` and `Reader(root=, providers=, limits=, index=)`. `geometry=GeometrySources(directories={model_id: path}, providers={(provider, format, format_version): adapter})` replaces `geometry=`, `geometries=`, `provider=` and `providers=` of `write`; a pin with no provider uses `rk.io.geometry_providers`. `parquet=ParquetOptions(compression=, row_group_size=)` replaces `compression=` and `row_group_size=`. `limits=ReadLimits(documents=, bytes=, rows=)` replaces `max_documents=`, `max_bytes=` and `max_rows=`; `index=IndexCheck.SCHEMA` replaces `check_index=False`. `Reader` has no `provider=`."
  - topic: Keyword-only arguments in io and the extension registries
    status: agreed
    source: "#410 D14"
    note: "Name each argument: `rk.io.json` and `rk.io.yaml` `loads(text=, kind=)`, `read(path=, kind=)` and `write(document=, path=)`; `rk.io.bundle.write(root=, model=, ...)` and `Reader(root=, ...)`; `rk.io.polars.dates(flow=, ...)` and `from_frame(frame=, units=)`; `GeometryProvider.validate(path=, geometry=)`, so a provider declares `def validate(self, *, path, geometry)`; and `register(name=, implementation=)` on `unit_systems`, `geometry_providers`, `profiles` and the execution backends `registry`. The store protocol stays positional: `put(document)` and `load_model(id)`, `load_specification(id)` and `load_run(id)`."
  - topic: Rules
    status: agreed
    source: "ADR-021, #255 D41, D42"
    note: "A rule is a query, `rk.specification.Window(...).where(condition=).first(otherwise=)`, fixed by key. The `Rule`, `Check` and `RuleEvidence` records of ADR-021 replace `RuleSet`, `Decision` and `Action` (#215)."

