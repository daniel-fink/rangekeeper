      `tuple(periods)` for a tuple
    status: agreed
    source: "#399, #404"
  - name: rangekeeper.duration.periods_between
    replacement: >-
      `Span(start=, end=).periods(frequency=, include_partial=, month_roll=)`,
      which returns a `Periods`. A Span is not empty, so the start must be
      before the end
    status: agreed
    source: "#399, #404"
  - name: rangekeeper.duration.Span.from_duration
    replacement: >-
      `Span(start=, length="10 years", name=)`, or `Periods(start=,
      frequency=, count=, month_roll=).span` for a half-year, a decade or
      another `MonthRoll`
    status: agreed
    source: "#399, #404"
  - name: rangekeeper.model.system.reducers
    replacement: >-
      The `rangekeeper.model.system.Reducer` enum: `SUM`, `MEAN`, `MIN`, `MAX`
