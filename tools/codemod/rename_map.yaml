removed:
  - name: rangekeeper.flow.MeanWeighting
    replacement: >-
      `ResampleMethod.MEAN` for `MeanWeighting.OBSERVATIONS` and
      `ResampleMethod.ELAPSED_MEAN` for `MeanWeighting.ELAPSED`. `resample`,
      `FlowRollup` and `formulation.flow.resample` take no `weighting=`
    status: agreed
    source: "#399, #405"
  - name: rangekeeper.flow.ResampleMethod.SPLIT
    replacement: "`flow.split(periods=)` or `flow.split(frequency=)`, and `Stream.split`"
    status: agreed
