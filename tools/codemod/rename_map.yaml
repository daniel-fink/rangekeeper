  - name: rangekeeper.duration.Frequency.BIWEEK
    replacement: >-
      `offset(..., frequency=Frequency.WEEK, count=2)` for a 14-day step, or
      explicit 14-day Periods for a grid. There is no fortnight frequency
    status: agreed
    source: "#399, #402"
  - name: rangekeeper.duration.make_period
    replacement: "`Period(start=, end=)`"
    status: agreed
