# Renames of attributes, methods and fields on one class. `apply: all`
# renames every attribute access with this name in the files in scope. Use it
# only when the old name is unique to the class. `apply: review` lists the
# uses for the pass to change by hand.
attributes:
  - owner: rangekeeper.execution.compiler.Compiled
    name: prepared
    new_name: binding
    apply: all
    status: agreed
    source: "ADR-013, #125"
  - owner: rangekeeper.model.system.view.View
    name: aggregate
    new_name: rollup
    apply: review
    status: agreed
    source: "#158, #255 D38"
    note: "`view.aggregate(reduction)` becomes `view.rollup(definition=rollup)`."
  - owner: rangekeeper.model.system.pivot.PivotColumn
    name: aggregation
    new_name: result
    apply: review
    status: agreed
    source: "#158, #255 D38"
  - owner: rangekeeper.shared.codes.Code
    name: AGGREGATION
    new_name: ROLLUP
    apply: all
    status: agreed
    source: "#388, #255 D38"
    note: "`rk.errors.Code.AGGREGATION` (`aggregation`) becomes `Code.ROLLUP` (`rollup`). Stored diagnostics keep the text they recorded."
  - owner: rangekeeper.specification.specification.Specification
    name: lock
    new_name: fix
    apply: all
    status: agreed
    source: ADR-012
  - owner: rangekeeper.specification.specification.Specification
    name: unlock
    new_name: free
    apply: all
    status: agreed
    source: ADR-012
  - owner: rangekeeper.schema.records.Period
    name: start_inclusive
    new_name: start
    apply: all
    status: agreed
    source: ADR-012
    note: >-
      Also Span. Half-open; the end is excluded. The package pass changed the
      schema in 1.0.0a2 (#119), so the consumer pass applies this entry.
  - owner: rangekeeper.schema.records.Period
    name: end_exclusive
    new_name: end
    apply: all
    status: agreed
    source: ADR-012
    note: Also Span.
  - owner: rangekeeper.model.flux.Stream
    name: labels
    new_name: names
    apply: review
    status: draft
    source: ADR-012
    note: >-
      Classification `labels` keep their name. The package pass renamed the
      Stream field by hand; the consumer pass lists the uses to check.
  - owner: rangekeeper.schema.records.Specification
    name: policy
    new_name: rules
    apply: review
    status: draft
    source: "ADR-021, #255 D41"
    requires: [schema]
    note: The Specification field and its wire key. `spec.rules` holds all of a Specification's rules.
  - owner: rangekeeper.schema.records.Report
    name: outcomes
    new_name: rule_evidence
    apply: review
    status: draft
    source: "ADR-021, #255 D41"
    requires: [schema]
    note: The Run report field and its wire key.
  - owner: rangekeeper.specification.policy.result.PolicyResult
    name: outcomes
    new_name: evidence
    apply: review
    status: agreed
    source: "#255 D41"
    note: The `RuleEvidence` records of one evaluation.
  - owner: "*"
    name: findings
    new_name: diagnostics
    apply: review
    status: draft
    source: ADR-012
  - owner: "*"
    name: issues
    new_name: diagnostics
    apply: review
    status: draft
    source: ADR-012
  - owner: rangekeeper.model.system.errors.HierarchyError
    name: ids
    new_name: targets
    apply: review
    status: agreed
    source: "#408"
    note: >-
      Every error has `targets`. `HierarchyError(code, message, ids=)` becomes
      `HierarchyError(message, code=, targets=)`: the message comes first and
      each field is a keyword.
  - owner: rangekeeper.shared.errors.PublishedFileError
    name: path
    new_name: file
    apply: review
    status: agreed
    source: "#408"
    note: >-
      `path` of every error is a JSON Pointer. `PublishedFileError(path, error)`
      becomes `PublishedFileError(message, file=)`; the OSError is the cause.
  - owner: rangekeeper.flow.flow.Flow
    name: difference
    new_name: diff
    apply: review
    status: agreed
    source: "#255 D2, D21, #275"
    note: >-
      `flow.diff()` takes no `initial=`: the first Movement is its amount less
      zero, not unresolved, so `flow.cumulative().diff() == flow`. For another
      opening value, subtract it in the first Period:
      `flow.diff() - rk.flow.Flow(amounts={first_period: opening}, units=)`.

