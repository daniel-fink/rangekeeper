    requires: [refactor]
    note: >-
      The scalar and Flow modes split. `Reduction(select=select_value(key),
      reducer=reducers.sum, units=)` becomes `QuantityRollup(key=, units=,
      reducer=Reducer.SUM)`; `Reduction.flows(key=, aggregation=, ...)` becomes
      `FlowRollup(key=, reducer=, ...)`. Both default to `Contributor.LEAVES`;
      the scalar default was every node. Custom selectors and reducers are
      removed.
