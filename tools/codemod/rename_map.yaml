# Rename map for the 1.0.0a2 rename pass (#93).
#
# The codemod in this folder reads this file. `render.py` writes the table in
# docs/guides/upgrading.md from it; do not edit that table by hand.
#
# Each entry has a status:
#   agreed  - the 1.0 name is in an accepted ADR (010, 012 or 018).
#   draft   - the ADR or a walkthrough decision gives the direction; this map
#             gives the exact name or location.
#   pending - depends on a decision under review. The codemod does not apply
#             it. No entry is pending since #255 (decisions D1-D44).
#   open    - the 1.0 name is not decided. The codemod does not apply it.
#
# `requires` names work that the codemod cannot do alone:
#   schema   - the field is generated from the LinkML schema; regenerate first.
#   refactor - the change is more than a rename or a move (split, merge or
#              new behaviour). The pass does it by hand.
# By default the codemod applies agreed and draft entries with no `requires`.

version: 1
package: rangekeeper
package_root: src/rangekeeper

# Files and folders that the codemod never changes. Records of decisions and
# history keep the names they were written with.
exclude:
  - .git/**
  - .venv/**
  - "**/__pycache__/**"
  - tools/codemod/**
  - docs/decisions/**
  - docs/history/**
  - docs/research/**
  - docs/guides/upgrading.md
  - CHANGELOG.md
  - changelog.d/**
  - examples/walkthrough/proposed/**
  - tests/contracts/test_retirement.py
  - tests/contracts/test_retired_system_names.py
  - walkthrough/**
  - src/rangekeeper/schema/records.py
  - src/rangekeeper/schema/enums.py
  - src/rangekeeper/schema/manifest.json
  - uv.lock

# Module moves. A move applies to the module and to all its submodules. The
# longest matching `old` wins.
modules:
  - old: rangekeeper.model.duration
    new: rangekeeper.duration
    status: agreed
    source: ADR-010
  - old: rangekeeper.model.flux
    new: rangekeeper.flow
    status: draft
    source: ADR-010
    note: Stream and the Flow re-exports become the `flow` package module.
  - old: rangekeeper.model._flow_mapping
    new: rangekeeper.flow._mapping
    status: draft
    source: ADR-010
  - old: rangekeeper.calculations._batch
    new: rangekeeper.flow._batch
    status: draft
    source: ADR-010
    note: The private calculation engine.
  - old: rangekeeper.calculations.series
    new: rangekeeper.flow
    status: agreed
    source: ADR-010
    note: >-
      The module is removed (#103). Its options and FlowAggregate are in
      `rangekeeper.flow`; Flow and Stream methods replace its functions (see
      the removed names).
  - old: rangekeeper.schema.behaviors.flow
    new: rangekeeper.flow
    status: agreed
    source: ADR-011, #106
    note: >-
      The behaviour modules are removed; generated records contain data only.
      Flow, Movement and MissingValueHandling are in `rangekeeper.flow`.
      Period and Span are in `rangekeeper.duration`; Distribution stays in
      `rangekeeper.model`.
  - old: rangekeeper.calculations
    new: rangekeeper.finance
    status: agreed
    source: ADR-010, ADR-012
  - old: rangekeeper.calculations.projection
    new: rangekeeper.profile
    status: agreed
    source: ADR-010, #255 D12
    note: >-
      Growth and distribution profiles. The word "projection" is not used.
      Profile classes and `Flow.from_profile` follow (#298).
  - old: rangekeeper.calculations.dynamics
    new: rangekeeper.market.dynamics
    status: agreed
    source: ADR-010, #255 D29
    note: Path generators are series maths, so they leave `finance`. `rk.market.Dynamics` follows (#299).
  - old: rangekeeper.run.execution
    new: rangekeeper.execution
    status: agreed
    source: ADR-010
  - old: rangekeeper.specification.policy
    new: rangekeeper.specification.rule
    status: agreed
    source: ADR-021, #255 D41
    note: '"Policy" is not used. The rule queries of ADR-021 replace the records later (#215).'
  - old: rangekeeper.specification.policy.evaluation
    new: rangekeeper.execution.rule
    status: draft
    source: ADR-010, #255 D41
    requires: [refactor]
    note: Rule evaluation moves to `execution` (#102). The lazy exports of `specification.rule` load it by its short name.
  - old: rangekeeper.shared.units
    new: rangekeeper.quantity
    status: agreed
    source: ADR-010, #255 D13
    note: >-
      The namespace that holds the unit system, the registry and `isclose` is
      `rangekeeper.quantity`, so "units" keeps one meaning: a unit string.
      `Quantity` is also at the root.
  - old: rangekeeper.io.store
    new: rangekeeper.io
    status: agreed
    source: ADR-010, #98
    note: >-
      The `RecordStore` protocol is defined in the internal `shared.store`, so
      `execution` does not import `io`. Import `RecordStore` and `Document`
      from `rangekeeper.io`.
  - old: rangekeeper.model.system.projection
    new: rangekeeper.model.system.table
    status: draft
    source: ADR-012
  - old: rangekeeper.model.scenario
    new: rangekeeper.market
    status: agreed
    source: ADR-010, ADR-014, #255 D29
    note: >-
      The generators, paths and replay move as they are. `rk.market.Paths`
      and the MarketPaths document replace the scenario plan (#299, #303).
  - old: rangekeeper.model.scenario.market
    new: rangekeeper.market.generation
    status: draft
    source: ADR-010, #255 D29
    note: Sampling, capture and realization of market paths; `rangekeeper.market.market` would repeat the name.

# Other file moves, relative to the repository root.
paths:
  - old: src/tests
    new: tests
    status: agreed
    source: ADR-018
    note: >-
      The pass moves the suite to the top level. #177 adds the sub-folders
      that mirror the packages, and tests/contracts, tests/integration and
      tests/walkthrough.

