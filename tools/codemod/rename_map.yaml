# Renames of attributes, methods and fields on one class. `apply: all`
# renames every attribute access with this name in the files in scope. Use it
# only when the old name is unique to the class. `apply: review` lists the
# uses for the pass to change by hand.
attributes:
  - owner: rangekeeper.specification.specification.Specification
    name: lock
    new_name: fix
    apply: all
    status: agreed
    source: ADR-012
  - owner: rangekeeper.specification.specification.Specification
    name: unlock
    new_name: free
    apply: all
    status: agreed
    source: ADR-012
  - owner: rangekeeper.schema.records.Period
    name: start_inclusive
    new_name: start
    apply: all
    status: agreed
    source: ADR-012
    note: >-
      Also Span. Half-open; the end is excluded. The package pass changed the
      schema in 1.0.0a2 (#119), so the consumer pass applies this entry.
  - owner: rangekeeper.schema.records.Period
    name: end_exclusive
    new_name: end
    apply: all
    status: agreed
    source: ADR-012
    note: Also Span.
  - owner: rangekeeper.model.flux.Stream
    name: labels
    new_name: names
    apply: review
    status: draft
    source: ADR-012
    note: >-
      Classification `labels` keep their name. The package pass renamed the
      Stream field by hand; the consumer pass lists the uses to check.
  - owner: rangekeeper.schema.records.Specification
    name: policy
    new_name: rules
    apply: review
    status: draft
    source: ADR-021, #255 D41
    requires: [schema]
    note: The Specification field and its wire key. `spec.rules` holds all of a Specification's rules.
  - owner: rangekeeper.schema.records.Report
    name: outcomes
    new_name: rule_evidence
    apply: review
    status: draft
    source: ADR-021, #255 D41
    requires: [schema]
    note: The Run report field and its wire key.
  - owner: rangekeeper.specification.policy.result.PolicyResult
    name: outcomes
    new_name: evidence
    apply: review
    status: agreed
    source: "#255 D41"
    note: The `RuleEvidence` records of one evaluation.
  - owner: "*"
    name: findings
    new_name: diagnostics
    apply: review
    status: draft
    source: ADR-012
  - owner: "*"
    name: issues
    new_name: diagnostics
    apply: review
    status: draft
    source: ADR-012

# Renames of keyword parameters. `callable: "*"` applies to every function and
# call in scope; use it only for names that are unique to the concept.
parameters:
  - callable: "*"
    name: start_inclusive
    new_name: start
    status: agreed
    source: ADR-012
  - callable: "*"
    name: end_exclusive
    new_name: end
    status: agreed
    source: ADR-012
  - callable: rangekeeper.specification.policy.evaluation.evaluate
    name: policy
    new_name: rules
    status: agreed
    source: "#255 D41"
  - callable: rangekeeper.model.flux.Stream.select
    name: labels
    new_name: names
    status: draft
    source: ADR-012
  - callable: rangekeeper.model.flux.Stream.from_values
    name: labels
    new_name: names
    status: draft
    source: ADR-012

# Names removed with no direct replacement. The codemod does not change these
# uses; it lists them with the replacement. Entries with `requires: [refactor]`
# are removed by later work; the codemod lists them only with `--with refactor`.
removed:
  - name: rangekeeper.calculations.account
    replacement: >-
      Compose the funding with Flows: a balance is `cumulative()`, and interest
      is `rangekeeper.finance.interest` (#255 D2, D23). A how-to recipe follows (#194)
    status: agreed
    source: "#255 D2"
  - name: rangekeeper.model.formulation.account.schedule
    replacement: >-
      Equations over Flows, such as `funding_need = -(net_cash_flow +
      loan_interest).cumulative()`. A Model declares no account (#255 D2)
    status: agreed
    source: "#255 D2"
  - name: rangekeeper.model.expression.authoring.sum
    replacement: >-
      Equation text or `rangekeeper.expressions` on entity handles (#255 D6,
      D18, D32). ADR-012 forbids public names that shadow builtins
    status: agreed
    source: ADR-012, #255 D18
    requires: [refactor]
  - name: rangekeeper.model.formulation.authoring.declare
    replacement: >-
      `rk.Model(name=)`, `model.edit()` and entity handles with `value(key=,
      units=)`, `flow(...)`, `date(...)` and `equations(...)` (#255 D6, D16)
    status: agreed
    source: ADR-015, #255 D6
    requires: [refactor]
  - name: rangekeeper.calculations.series.align
    replacement: Stream(flows, join=, missing=).align()
    status: agreed
    source: ADR-010
  - name: rangekeeper.calculations.series.multiply
    replacement: Flow.multiply(*others)
    status: agreed
    source: ADR-010
  - name: rangekeeper.calculations.series.integrate
    replacement: Flow.integrate(exposures=, day_count=, units=)
    status: agreed
    source: ADR-010
  - name: rangekeeper.calculations.series.resample
    replacement: Flow.resample(periods, method=) and Stream.resample(periods, method=)
    status: agreed
    source: ADR-010
  - name: rangekeeper.calculations.series.aggregate
    replacement: Stream.aggregate(method=), Stream.sum(), Stream.min() and Stream.max()
    status: agreed
    source: ADR-010
  - name: rangekeeper.calculations.series.Alignment
    replacement: The Stream that Stream.align() returns; Stream.aggregate() replaces Alignment.reduce()
    status: agreed
    source: ADR-010
  - name: rangekeeper.model.characteristics
    replacement: Value and Label access on the owner record; re-exports in rangekeeper.model
    status: agreed
    source: ADR-012
  - name: rangekeeper.model.scenario.market.ScenarioPlan
    replacement: Path generators and the MarketPaths document
    status: agreed
    source: ADR-012, ADR-014
    requires: [refactor]
  - name: rangekeeper.model.scenario.market.sample
    replacement: Path generators and the MarketPaths document
    status: agreed
    source: ADR-012, ADR-014
    requires: [refactor]
  - name: rangekeeper.model.scenario.market.capture
    replacement: Path generators and the MarketPaths document
    status: agreed
    source: ADR-012, ADR-014
    requires: [refactor]
  - name: rangekeeper.model.scenario.market.realize
    replacement: Path generators and the MarketPaths document
    status: agreed
    source: ADR-012, ADR-014
    requires: [refactor]
  - name: rangekeeper.model.scenario.market.generate
    replacement: Path generators and the MarketPaths document
    status: agreed
    source: ADR-012, ADR-014
    requires: [refactor]
  - name: rangekeeper.model.scenario.view.Market
    replacement: The MarketPaths document
    status: agreed
    source: ADR-012, ADR-014
    requires: [refactor]
  - name: rangekeeper.shared.errors.BoundaryError
    replacement: rangekeeper.errors.RangekeeperError
    status: agreed
    source: ADR-016
  - name: rangekeeper.shared.errors.ValueEncodingError
    replacement: rangekeeper.errors.EncodingError
    status: agreed
    source: ADR-016

# Decisions of #255 that change API shapes, not names. They are listed in the
# upgrade guide. The codemod does not apply them.
notes:
  - topic: Quantity text in API arguments
    status: agreed
    source: "#255 D13, D16, D17"
    note: Arguments take unit text such as `"7 % pa"`; `per` divides and `pa` means per year.
  - topic: Keyword-only arguments
    status: agreed
    source: "#255 D14"
    note: Every Rangekeeper call names its arguments.
  - topic: Model authoring and builder names
    status: agreed
    source: "#255 D6, D16, D18"
    note: "`rk.Model(name=)`, `model.edit()`, `ModelDraft.add_entity(code=)` and entity handles."
  - topic: Specification calls
    status: agreed
    source: "#255 D7, D8"
    note: "`fix`, `free`, `cases`, `across` and `parameters` each return a new Specification; unfixed values are free."
  - topic: Loan payment
    status: agreed
    source: "#255 D19"
    note: "`rangekeeper.finance.payment(principal=, rate=, term=, frequency=)` (#167)."
  - topic: Funding accounts
    status: agreed
    source: "#255 D2, D23"
    note: There is no account class and no account declaration. A balance is `cumulative()` of a Flow.
  - topic: Growth and distribution profiles
    status: agreed
    source: "#255 D12"
    note: "`rk.profile.Constant`, `Linear`, `Compounding`, `Uniform` and `SCurve` with `rk.flow.Flow.from_profile(profile=, periods=, initial= or total=)` replace `extrapolate`, `distribute` and `GrowthMethod` (#298)."
  - topic: Market paths
    status: agreed
    source: "#255 D29, D31"
    note: "`rk.market.Dynamics`, `rk.market.generate` and `rk.market.Paths` replace the scenario plan and the trend and cycle kernels (#299, #303)."
  - topic: Fixed words are enums
    status: agreed
    source: "#255 D26"
    note: "Diagnostic codes are `rk.errors.Code` (#154); \"the event does not happen\" is `rk.duration.NEVER`; `Role`, `DecisionResult`, `Status` and `Direction` are enums. Words that the data defines stay strings."
  - topic: Rules
    status: agreed
    source: ADR-021, #255 D41, D42
    note: "A rule is a query, `rk.specification.Window(...).where(condition=).first(otherwise=)`, fixed by key. The `Rule`, `Check` and `RuleEvidence` records of ADR-021 replace `RuleSet`, `Decision` and `Action` (#215)."

# Exact text edits for cases that the rules do not cover. Each edit applies
# only when `old` occurs once in the file, so a second run changes nothing.
fixups:
  - path: src/tests/test_retirement.py
    old: "    \"duration\",\n"
    new: ""
    status: agreed
    source: ADR-010
    note: The retirement guard lists the 0.x module `rangekeeper.duration`; 1.0 reuses the name for a public package.
  - path: src/tests/test_retirement.py
    old: "    \"execution\",\n"
    new: ""
    status: agreed
    source: ADR-010
    note: The retirement guard lists the 0.x module `rangekeeper.execution`; 1.0 reuses the name for a public package.
  - path: src/tests/test_legacy_boundary.py
    old: "        \"table\",\n"
    new: ""
    status: agreed
    source: ADR-012
    note: The guard lists the retired 0.x module `model.system.table`; 1.0 reuses the name for `model.system.projection`.
