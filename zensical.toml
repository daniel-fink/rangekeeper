# The docs site (ADR-018). Build and serve it with tools/docs/site.py, which
# stages docs/ in _build/docs with the lesson pages and the API reference.
[project]
site_name = "Rangekeeper"
site_description = "Algorithmic modelling for project finance"
site_url = "https://daniel-fink.github.io/rangekeeper/"
repo_url = "https://github.com/daniel-fink/rangekeeper"
repo_name = "daniel-fink/rangekeeper"
copyright = "Rangekeeper contributors, MPL-2.0"
docs_dir = "_build/docs"
site_dir = "_build/site"
# mike publishes versions to this branch. Publication is an explicit, approved
# step (docs/contributing/walkthrough-branch.md#publish-the-book).
remote_branch = "gh-pages"
remote_name = "origin"

[project.theme]
features = [
    "content.code.copy",
    "navigation.indexes",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

# The version selector reads versions.json, which mike writes at the site root.
[project.extra.version]
provider = "mike"
default = "1.0"

[project.plugins.awesome-nav]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
# Each page gives the module name as its title.
show_root_heading = false
show_signature_annotations = true
separate_signature = true
members_order = "source"
filters = ["!^_"]
merge_init_into_class = true
show_if_no_docstring = false
