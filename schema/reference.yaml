id: https://daniel-fink.github.io/rangekeeper/schema/reference
name: rangekeeper_reference
version: 1.0.0
prefixes:
  linkml: https://w3id.org/linkml/
  rk: https://daniel-fink.github.io/rangekeeper/schema/
imports:
- characteristics
default_prefix: rk
default_range: string
classes:
  Reference:
    description: A Value or Movement UUID resolved in the containing Model or composed Specification. Execution diagnostic references resolve in the Run's input Model. Names, matching keys and positions are never identities.
    attributes:
      target:
        description: UUID of a Value or Movement declaration in the applicable scope.
        range: UUID
        required: true
  Assignment:
    description: An explicit target and its supplied content, a finite Quantity for a scalar Value or a Movement, or
      a date or NEVER for a date Value; its collection determines assignment or estimate semantics.
    notes:
    - This record has no independent identity. Its containing field supplies its role. In assignments the content
      is enforced; in estimates it initializes an unknown without imposing an equality.
    - The target Value supplies its Measure and meaning. Quantity units must be compatible with the Measure's canonical
      units under the agreed unit convention. Conversion must preserve magnitude and meaning. A bare Quantity cannot
      change the target's Measure or kind, and finite zero is valid supplied content.
    - A date Value takes a date or NEVER, in the shape of a date Value, and no Quantity. A scalar Value or a Movement
      takes a Quantity, and no date.
    - Formulation.Binding names an alias to a shared symbol; Assignment supplies content to that symbol. Neither
      record duplicates the Value declaration. Recorded content is reused only by supplying it explicitly.
    attributes:
      target:
        description: Value or Movement to which the content is supplied.
        range: Reference
        required: true
        inlined: true
      quantity:
        description: Explicit finite magnitude and compatible units for a scalar Value or a Movement; omission or
          null is not a supplied amount.
        range: Quantity
        inlined: true
        all_of:
        - range: Quantity
          inlined: true
      date:
        description: The calendar date supplied to a date Value; it excludes quantity and never.
        range: date
      never:
        description: Supplies NEVER to a date Value, the event does not happen; it excludes quantity and date.
        range: Never
    exactly_one_of:
    - slot_conditions:
        quantity:
          required: true
    - slot_conditions:
        date:
          required: true
    - slot_conditions:
        never:
          required: true
