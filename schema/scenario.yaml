id: https://daniel-fink.github.io/rangekeeper/schema/scenario
name: rangekeeper_scenario
version: 1.0.0
prefixes:
  linkml: https://w3id.org/linkml/
  rk: https://daniel-fink.github.io/rangekeeper/schema/
imports:
- flow
- reference
- binding
- distribution
default_prefix: rk
default_range: string
classes:
  ScenarioParameter:
    description: One named constant or sampled parameter; exactly one input is required by semantic validation.
    attributes:
      name:
        description: Parameter name of the market method contract, unique within the plan.
        range: Code
        required: true
      quantity:
        description: Fixed quantity; give this or distribution, not both.
        range: Quantity
        inlined: true
      distribution:
        description: Distribution to sample; give this or quantity, not both.
        range: Distribution
        inlined: true
  ScenarioPlan:
    description: Finite market generation plan. This is input-generation provenance, not governing mathematics.
    attributes:
      id:
        description: Stable identity of the plan.
        range: UUID
        required: true
        identifier: true
      method:
        description: Code of the market method contract that the plan uses.
        range: string
        required: true
      seed:
        description: Nonnegative master seed of the random streams.
        range: integer
        required: true
        minimum_value: 0
      periods:
        description: Nonempty ordered calendar periods of the generated paths; periods do not overlap.
        range: Period
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      parameters:
        description: Parameters of the method; their names match the parameter inventory of the method.
        range: ScenarioParameter
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  RandomStream:
    description: Stable component stream identity derived from seed, scenario key and component name.
    attributes:
      name:
        description: Name of the parameter or input that the stream samples.
        range: Code
        required: true
      identifier:
        description: SHA-256 hexadecimal digest of the scenario key and stream component; with the plan seed,
          it seeds the stream.
        range: string
        required: true
  LibraryVersion:
    description: Recorded implementation dependency version.
    attributes:
      name:
        description: Name of the dependency, such as python.
        range: string
        required: true
      version:
        description: Version of the dependency.
        range: string
        required: true
  ObservationAvailability:
    description: Earliest date a recorded Value or Movement may be supplied to a rule.
    attributes:
      target:
        description: Recorded Value or Movement; scenario validation requires a Movement.
        range: Reference
        required: true
        inlined: true
      available_at:
        description: Earliest date on which a rule can observe the target.
        range: date
        required: true
  CalculationProvenance:
    description: Calculation implementation identity, separate from captured sampling provenance.
    attributes:
      name:
        description: Name of the calculation implementation.
        range: string
        required: true
      fingerprint:
        description: Format-prefixed digest of the calculation manifest, which covers its sources, resources
          and dependency versions.
        range: string
        required: true
      versions:
        description: Dependency versions included in the fingerprint.
        range: LibraryVersion
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  ScenarioRealization:
    description: Captured scenario inputs and paths. Stored draws permit replay without random sampling.
    attributes:
      id:
        description: Stable identity of the realization.
        range: UUID
        required: true
        identifier: true
      plan:
        description: Complete plan from which the scenario inputs were generated.
        range: ScenarioPlan
        required: true
        inlined: true
      key:
        description: Scenario key; with the plan seed, it determines the random streams.
        range: Code
        required: true
      calculation:
        description: Calculation that produced the realized paths; absent for inputs without realized paths.
        range: CalculationProvenance
        inlined: true
      generator:
        description: Random generation algorithm, such as numpy.SeedSequence/PCG64, or supplied for captured
          inputs.
        range: string
        required: true
      versions:
        description: Dependency versions of the sampling or capture environment.
        range: LibraryVersion
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      streams:
        description: Random streams used to sample the inputs; empty for supplied inputs.
        range: RandomStream
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      inputs:
        description: Bindings of the captured input Values.
        range: Binding
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      outputs:
        description: Bindings of the realized path Values; empty until the paths are realized.
        range: Binding
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      availability:
        description: Earliest observation dates of the recorded Movements.
        range: ObservationAvailability
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
