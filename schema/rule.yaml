id: https://daniel-fink.github.io/rangekeeper/schema/rule
name: rangekeeper_rule
version: 1.0.0
prefixes:
  linkml: https://w3id.org/linkml/
  rk: https://daniel-fink.github.io/rangekeeper/schema/
imports:
- duration
- expression
- reference
default_prefix: rk
default_range: string
classes:
  RuleDeclaration:
    description: One rule as a query over a window of dates. On each path it fixes one value on the first window date
      on which its condition holds, or fixes otherwise.
    notes:
    - The order of the rules in their list is the order in which they run. The target identifies a rule; a Specification
      has one rule for a target.
    - A rule is a declaration only. It reads no solved amount until the rules stage runs. The decided value is a fixed
      value in the affine problem, so the problem never contains a rule (ADR-021).
    - Without periods, a window date is each date on which a Flow that the condition reads gets a known amount. With
      periods, a window date is the timing day of each Period.
    attributes:
      target:
        description: The Value that the rule decides, a date Value or a scalar measurement Value.
        range: Reference
        required: true
        inlined: true
      condition:
        description: Boolean Expression that the rule tests on each window date. It reads Values, parameters and the
          values of earlier rules.
        range: Expression
        required: true
        inlined: true
      otherwise:
        description: Literal Expression that the target takes when no window date meets the condition, a quantity,
          a date or NEVER.
        range: Expression
        required: true
        inlined: true
      then:
        description: Literal Expression that the target takes when the condition holds. Absent or null means the
          window date itself, which fits a date Value only.
        range: Expression
        inlined: true
      earliest:
        description: Inclusive first bound of the window, a date Expression. An Expression that reads an undecided
          value keeps the window closed. Absent or null means no bound.
        range: Expression
        inlined: true
      latest:
        description: Inclusive last bound of the window, a date Expression. An Expression that reads an undecided value
          keeps the window open. Absent or null means no bound.
        range: Expression
        inlined: true
      periods:
        description: Nonempty ordered Periods that give the calendar of the window. Absent or null means that the
          window acts when a value that the condition reads becomes known.
        range: Period
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      timing:
        description: The day of each Period that is its window date. Absent or null means the first day. It needs
          periods.
        range: PeriodTiming
  ObservationBinding:
    description: An explicit observation target. An optional date may delay availability but cannot advance it.
    attributes:
      name:
        description: Name of the observation, unique within its Decision.
        range: Code
        required: true
      target:
        description: Value or Movement whose recorded or decided quantity the Decision observes.
        range: Reference
        required: true
        inlined: true
      available_at:
        description: Optional date that can delay availability; it cannot make the quantity available earlier.
        range: date
  Action:
    description: An inert assignment or terminal action. Effects are applied atomically; no Python callbacks.
    attributes:
      kind:
        description: Whether the action assigns a control or terminates the decision sequence.
        range: ActionKind
        required: true
      target:
        description: Controlled target to assign; required for assign and absent for terminate.
        range: Reference
        inlined: true
      quantity:
        description: Finite quantity to assign, with units compatible with the target; required for assign and
          absent for terminate.
        range: Quantity
        inlined: true
  Rule:
    description: One ordered Boolean condition and its atomic actions.
    attributes:
      id:
        description: Stable identity of the Rule, referenced by DecisionEvidence.
        range: UUID
        required: true
        identifier: true
      condition:
        description: Boolean Expression that refers only to the observations of its Decision.
        range: Expression
        required: true
        inlined: true
      actions:
        description: Nonempty ordered actions applied when this is the first true Rule; terminate can only be
          last.
        range: Action
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  Decision:
    description: One dated rule decision with explicit observations, first-match rules and fallback.
    attributes:
      id:
        description: Stable identity of the Decision, referenced by DecisionEvidence.
        range: UUID
        required: true
        identifier: true
      at:
        description: Decision date; dates increase strictly within the RuleSet.
        range: date
        required: true
      observations:
        description: Ordered observations that the rule conditions can read.
        range: ObservationBinding
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      rules:
        description: Ordered rules; the first Rule whose condition is true supplies the actions.
        range: Rule
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      fallback:
        description: Nonempty ordered actions applied when no rule condition is true.
        range: Action
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  RuleSet:
    description: The rules of a Specification, owning explicit controlled targets and ordered dated decisions.
    attributes:
      id:
        description: Stable identity of the RuleSet.
        range: UUID
        required: true
        identifier: true
      targets:
        description: Nonempty unique controlled targets; the decision actions must assign each one.
        range: Reference
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      decisions:
        description: Dated Decisions in strictly increasing date order.
        range: Decision
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  ObservedQuantity:
    description: The exact quantity and availability supplied to a decision.
    attributes:
      name:
        description: Name of the ObservationBinding that this quantity satisfies.
        range: Code
        required: true
      target:
        description: Observed Value or Movement, equal to the target of the ObservationBinding.
        range: Reference
        required: true
        inlined: true
      quantity:
        description: Exact quantity supplied to the rule conditions.
        range: Quantity
        required: true
        inlined: true
      available_at:
        description: Date from which the quantity was available; it is not later than the Decision date.
        range: date
        required: true
  DecisionEvidence:
    description: Recorded evidence of one evaluated Decision of a RuleSet; absence of a rule means fallback.
    attributes:
      decision:
        description: UUID of the evaluated Decision.
        range: UUID
        required: true
      at:
        description: Date of the evaluated Decision.
        range: date
        required: true
      rule:
        description: UUID of the first Rule whose condition was true; absent or null when the fallback
          applied.
        range: UUID
      observations:
        description: Observed quantities, in the order of the Decision observations.
        range: ObservedQuantity
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      assignments:
        description: Assignments made by the applied actions, in action order.
        range: Assignment
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      terminated:
        description: Whether the applied actions terminated the decision sequence; no evidence follows a
          termination.
        range: boolean
        required: true
      termination_reason:
        range: string
        description: Reason for termination, required when terminated is true.
  TraceValue:
    description: One value in a decision trace, a Quantity, a calendar date or NEVER.
    attributes:
      quantity:
        description: The amount of a scalar Value or a Movement; it excludes date and never.
        range: Quantity
        inlined: true
      date:
        description: The calendar date of a date Value; it excludes quantity and never.
        range: date
      never:
        description: The value of a date Value when the event does not happen; it excludes quantity and date.
        range: Never
    exactly_one_of:
    - slot_conditions:
        quantity:
          required: true
    - slot_conditions:
        date:
          required: true
    - slot_conditions:
        never:
          required: true
  Observation:
    description: One value that a rule read on a window date, and when it became available.
    attributes:
      name:
        description: The text of what the condition reads, unique within its Check, such as rent_index or
          rent_index.shift(by=1).
        range: string
        required: true
      target:
        description: The Value that the rule read, or the Movement for a reading of a Flow.
        range: Reference
        required: true
        inlined: true
      source:
        description: Where the value comes from.
        range: ObservationSource
        required: true
      value:
        description: The value that the rule read. Absent or null means that the value was undecided, so the observation
          is unknown.
        range: TraceValue
        inlined: true
      available_on:
        description: The date from which the value was available; it is not after the date of the Check. Absent or null
          means always available, or undecided.
        range: date
  Check:
    description: One record of a decision trace, a window date of a rule or the date on which the rule took otherwise.
    attributes:
      target:
        description: The Value that the rule decides, which identifies the rule.
        range: Reference
        required: true
        inlined: true
      key:
        description: The key of that Value in the input Model.
        range: string
        required: true
      date:
        description: The date of this record.
        range: date
        required: true
      result:
        description: The result of this record.
        range: DecisionResult
        required: true
      condition:
        description: The result of the condition. Absent or null means unknown, or that this record tested no condition.
        range: boolean
      observations:
        description: The values that the condition read, in the order of the condition. Absent or null means that this
          record tested no condition.
        range: Observation
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      earliest:
        description: The earliest bound of the window on this date. Absent or null means no bound, or an undecided bound.
        range: TraceValue
        inlined: true
      latest:
        description: The latest bound of the window on this date. Absent or null means no bound, or an undecided bound.
        range: TraceValue
        inlined: true
      value:
        description: The value that this record fixes. It is present when the result is decided or otherwise, and only
          then.
        range: TraceValue
        inlined: true
  DecidedValue:
    description: The value that a rule fixed on one path, and its decision date.
    attributes:
      target:
        description: The Value that the rule decides, which identifies the rule.
        range: Reference
        required: true
        inlined: true
      key:
        description: The key of that Value in the input Model.
        range: string
        required: true
      value:
        description: The value that the rule fixed.
        range: TraceValue
        required: true
        inlined: true
      decision_date:
        description: The date on which the rule fixed the value.
        range: date
        required: true
  RuleEvidence:
    description: The decision trace of one case, its decided values, its solve count and the result of its trace check
      (ADR-021).
    notes:
    - A case that fails during the rules stage keeps the records up to its failure, so decided can have fewer values than
      the Specification has rules.
    - The trace check reads only this record, the rules, the path data and the output Model, so it can run on a stored
      Run with no solve. A failed trace check fails the case with a rule_trace diagnostic in the report.
    attributes:
      checks:
        description: One record for each window date and each otherwise, in the order in which they ran.
        range: Check
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      decided:
        description: The value of each rule that fixed its value, in the order of the decisions.
        range: DecidedValue
        required: true
        inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      provisional_solves:
        description: The number of provisional solves that the rules needed. The final solve of the case is one more.
        range: integer
        required: true
        minimum_value: 0
      verified:
        description: Whether the trace check passed on a candidate. False means that the case has no candidate, or that
          the check found a difference.
        range: boolean
        required: true
enums:
  ActionKind:
    description: What a Rule action does.
    permissible_values:
      assign:
        description: Assign a quantity to a controlled target.
      terminate:
        description: End the decision sequence.
  DecisionResult:
    description: The result of one check of a decision rule.
    permissible_values:
      decided:
        description: The condition held, so the rule decided the value on this date.
      not_met:
        description: The condition did not hold on this date; the rule keeps checking.
      skipped:
        description: The rule did not test its condition on this date.
      otherwise:
        description: No check decided the value, so the otherwise value applies.
  ObservationSource:
    description: Where the value that a rule read comes from.
    permissible_values:
      path:
        description: A market path that fixes the Movement.
      fixed:
        description: A value that the Specification fixes.
      parameter:
        description: A parameter of the rule.
      decided:
        description: A value that an earlier rule decided.
      solved:
        description: A value of the provisional solution.
