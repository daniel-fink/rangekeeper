functions:
- id: f3827f2b-2f45-5032-b067-89e8ff73f0fa
  code: collection.sum
  name: Sum measurements
  version: '1'
  parameters:
  - name: items
    domain:
      kind: collection
      item_domain:
        kind: measurement
    kind: positional_or_named
    required: true
  result:
    kind: measurement
  semantics: Sum every element, retaining multiplicity. Members must have compatible units and measurement
    meaning. Unresolved members remain symbolic; none are dropped. An empty collection is rejected because
    this signature does not establish result units without a member.
  unit_rule: The result has the common measurement units of the members.
  empty_collection: error
- id: e101eef7-62ac-5a3e-ab82-e84b5e19d58e
  code: collection.count
  name: Count entities
  version: '1'
  parameters:
  - name: items
    domain:
      kind: collection
      item_domain:
        kind: entity
    kind: positional_or_named
    required: true
  result:
    kind: number
  semantics: Count collection members, retaining multiplicity. An empty collection has count zero.
  unit_rule: Dimensionless integer result.
  empty_collection: zero
