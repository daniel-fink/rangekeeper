id: https://daniel-fink.github.io/rangekeeper/schema/query
name: rangekeeper_query
title: Rangekeeper Queries
version: 1.0.0
description: Declarative traversal, filtering, and projection within one immutable Model revision.
prefixes:
  linkml: https://w3id.org/linkml/
  rk: https://daniel-fink.github.io/rangekeeper/schema/
imports:
- assembly
default_prefix: rk
default_range: string
classes:
  Traversal:
    description: One traversal step over domain Relationships or Assembly membership.
    notes:
    - direct traverses one edge; transitive traverses one or more edges. The input itself is not a result
      of a traversal step.
    - 'For transitive traversal, paths are simple: an Entity cannot recur within one path. Multiple paths
      may reach the same Entity; final Query duplicate handling determines whether repeated projected
      identities survive.'
    - Relationship traversal uses exactly the specified Classification and direction. Membership follows
      Assembly.entities outward, never inferring physical containment. Non-Assembly inputs have no outgoing
      membership edges.
    attributes:
      kind:
        description: Whether the step follows classified Relationships or Assembly membership.
        range: TraversalKind
        required: true
      depth:
        description: Whether the step follows exactly one edge or one or more edges.
        range: Depth
        required: true
      classification:
        range: Classification
        description: Exact Classification of Relationships to follow.
        inlined: false
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        any_of:
        - range: Classification
          inlined: false
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      direction:
        description: Direction in which to follow Relationships; required for relationship steps and absent
          for membership steps.
        range: Direction
    rules:
    - preconditions:
        slot_conditions:
          kind:
            equals_string: relationship
      postconditions:
        slot_conditions:
          classification:
            required: true
          direction:
            required: true
    - preconditions:
        slot_conditions:
          kind:
            equals_string: membership
      postconditions:
        slot_conditions: {}
        all_of:
        - slot_conditions:
            classification:
              value_presence: ABSENT
        - slot_conditions:
            direction:
              value_presence: ABSENT
  Criterion:
    description: Require an Entity Label with this owner-local key to include a Classification, or one of
      its sub-types.
    notes:
    - A Label matches when it includes the Classification or, unless exclusive, one of its sub-types in
      its Taxonomy. An Entity without a Label of this key has a missing value; it does not pass.
    attributes:
      key:
        range: string
        description: Owner-local Label key.
        required: true
        any_of:
        - range: string
        pattern: \S
      classification:
        description: UUID of the Classification that the Label must include.
        range: Classification
        required: true
        inlined: false
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        any_of:
        - range: Classification
          inlined: false
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      exclusive:
        description: Whether only the Classification itself matches; absent or false also matches its
          sub-types in its Taxonomy.
        range: boolean
  ValueTest:
    description: One test of the recorded measurement Value with an owner-local key, after conversion to
      the units of the test.
    notes:
    - A comparison converts the recorded Quantity to the units of the test with the Model's unit system.
      Incompatible units are an error, not a failed test.
    - Equality and the inclusive bounds use the unit system's closeness tolerance, so 1 km equals 1000 m.
    - A missing Value or an unresolved Quantity is a missing value. It never counts as zero. A comparison
      with a missing value does not pass, and the result counts it as missing. Only the missing relation
      passes it.
    - present and missing test any Value kind; the comparisons need a measurement Value.
    attributes:
      key:
        range: string
        description: Owner-local key of the tested Value.
        required: true
        any_of:
        - range: string
        pattern: \S
      relation:
        description: How the recorded Value relates to the operands.
        range: ValueRelation
        required: true
      quantity:
        description: Operand of a comparison; absent for between, present and missing.
        range: Quantity
        inlined: true
        all_of:
        - range: Quantity
          inlined: true
      minimum:
        description: Inclusive lower bound of between; absent for other relations.
        range: Quantity
        inlined: true
        all_of:
        - range: Quantity
          inlined: true
      maximum:
        description: Inclusive upper bound of between; absent for other relations.
        range: Quantity
        inlined: true
        all_of:
        - range: Quantity
          inlined: true
    rules:
    - preconditions:
        slot_conditions:
          relation:
            equals_string_in:
            - equal
            - not_equal
            - less
            - less_or_equal
            - greater
            - greater_or_equal
      postconditions:
        slot_conditions:
          quantity:
            required: true
        all_of:
        - slot_conditions:
            minimum:
              value_presence: ABSENT
        - slot_conditions:
            maximum:
              value_presence: ABSENT
    - preconditions:
        slot_conditions:
          relation:
            equals_string: between
      postconditions:
        slot_conditions:
          minimum:
            required: true
          maximum:
            required: true
        all_of:
        - slot_conditions:
            quantity:
              value_presence: ABSENT
    - preconditions:
        slot_conditions:
          relation:
            equals_string_in:
            - present
            - missing
      postconditions:
        slot_conditions: {}
        all_of:
        - slot_conditions:
            quantity:
              value_presence: ABSENT
        - slot_conditions:
            minimum:
              value_presence: ABSENT
        - slot_conditions:
            maximum:
              value_presence: ABSENT
  Filter:
    description: Conjunctive tests of Entity metadata and recorded Values, as data. A missing value never
      passes a test.
    notes:
    - classification matches the Classification and its sub-types in its Taxonomy, unless exclusive. An
      Entity without a classification does not pass.
    - All Label criteria and all Value tests must hold. A test that cannot be decided because its value is
      missing does not pass; results count such Entities as missing, separately from those that fail.
    - An empty filter matches every candidate. Raw-text properties have no tests.
    attributes:
      classification:
        description: Classification that a candidate Entity must have, with its sub-types unless exclusive.
        range: Classification
        inlined: false
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        any_of:
        - range: Classification
          inlined: false
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      exclusive:
        description: Whether only the Classification itself matches; absent or false also matches its
          sub-types in its Taxonomy.
        range: boolean
      labels:
        range: Criterion
        description: All listed Label conditions must hold.
        inlined: true
        any_of:
        - range: Criterion
          inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      tests:
        range: ValueTest
        description: All listed Value tests must hold.
        inlined: true
        any_of:
        - range: ValueTest
          inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
  Projection:
    description: Select Entity identities or Values belonging to each matching Entity.
    notes:
    - Value projection uses either an exact owner-local key or a Measure UUID. A key is not a cross-Model
      identity; projection resolves it to identified Values in this revision.
    - With cardinality one, more than one match is an error. With cardinality many, all matches are retained.
      Zero matches follow missing, independently of cardinality.
    - A Value with an unresolved Quantity still exists and is included. missing applies only to the absence
      of a matching Value, never to its numerical content.
    attributes:
      kind:
        description: Whether the query returns Entity identities or Values of the matching Entities.
        range: ProjectionKind
        required: true
      key:
        range: string
        description: Exact owner-local Value key.
        any_of:
        - range: string
        pattern: \S
      measure:
        range: Measure
        description: Select Values with this exact Measure.
        inlined: false
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        any_of:
        - range: Measure
          inlined: false
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      cardinality:
        description: Number of Values permitted for each Entity; required for value projection and absent for
          entity projection.
        range: Cardinality
      missing:
        description: Treatment of an Entity with no matching Value; required for value projection and absent
          for entity projection.
        range: MissingHandling
    rules:
    - preconditions:
        slot_conditions:
          kind:
            equals_string: entity
      postconditions:
        slot_conditions: {}
        all_of:
        - slot_conditions:
            key:
              value_presence: ABSENT
        - slot_conditions:
            measure:
              value_presence: ABSENT
        - slot_conditions:
            cardinality:
              value_presence: ABSENT
        - slot_conditions:
            missing:
              value_presence: ABSENT
    - preconditions:
        slot_conditions:
          kind:
            equals_string: value
      postconditions:
        slot_conditions:
          cardinality:
            required: true
          missing:
            required: true
        exactly_one_of:
        - slot_conditions:
            key:
              required: true
        - slot_conditions:
            measure:
              required: true
  Query:
    description: A non-executing query specification returning Entity or Value identities from the containing
      Model revision.
    notes:
    - starting_at must identify an Entity in the containing Model revision. Queries never fetch live external
      state. An embedded Query is owned by its Expression; no second identity is required.
    - Apply traversal steps in order, then the filter, then projection, then duplicate handling. With
      no steps, the starting Entity is the candidate. A candidate whose filter has a missing value does not
      pass.
    - Query results are symbolic references. Projecting Values preserves their mathematical roles and
      unresolved content; it does not freeze stored amounts.
    - distinct yields a set keyed by projected UUID; preserve yields a bag with one occurrence per matching
      traversal path and projected match. Neither promises ordering; positional indexing requires an ordered
      collection.
    - A valid query with no matching Entities returns an empty collection. Aggregating that collection
      follows the Function contract. Fixed metadata may determine membership; unknown numerical values
      may not.
    attributes:
      starting_at:
        description: UUID of the Entity in the containing Model revision where the query starts.
        range: Entity
        required: true
        inlined: false
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        any_of:
        - range: Entity
          inlined: false
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      steps:
        range: Traversal
        description: Ordered traversal steps; omission selects the starting Entity.
        inlined: true
        any_of:
        - range: Traversal
          inlined: true
        multivalued: true
        inlined_as_list: true
        list_elements_ordered: true
      filter:
        description: Optional conditions applied to the candidates after traversal.
        range: Filter
        inlined: true
        all_of:
        - range: Filter
          inlined: true
      projection:
        description: Selection of Entity identities or Values from the filtered candidates.
        range: Projection
        required: true
        inlined: true
        all_of:
        - range: Projection
          inlined: true
      duplicates:
        description: Whether repeated projected UUIDs are kept or removed.
        range: DuplicateHandling
        required: true
enums:
  TraversalKind:
    permissible_values:
      relationship:
        description: Traverse classified domain Relationships.
      membership:
        description: Traverse Assembly entity membership.
  Depth:
    permissible_values:
      direct:
        description: Exactly one edge.
      transitive:
        description: One or more edges along finite simple paths.
  Direction:
    permissible_values:
      outgoing:
        description: Follow source to target.
      incoming:
        description: Follow target to source.
  ProjectionKind:
    permissible_values:
      entity:
        description: Return matching Entity identities.
      value:
        description: Return identified Values selected from matching Entities.
  Cardinality:
    permissible_values:
      one:
        description: At most one Value per Entity; multiple matches are an error.
      many:
        description: All matching Values per Entity.
  MissingHandling:
    permissible_values:
      error:
        description: Reject an Entity with no matching Value.
      omit:
        description: Explicitly omit an Entity with no matching Value.
  ValueRelation:
    permissible_values:
      equal:
        description: The value equals quantity, within the unit system's closeness tolerance.
      not_equal:
        description: The value does not equal quantity.
      less:
        description: The value is less than quantity and not equal to it.
      less_or_equal:
        description: The value is less than or equal to quantity.
      greater:
        description: The value is greater than quantity and not equal to it.
      greater_or_equal:
        description: The value is greater than or equal to quantity.
      between:
        description: The value is from minimum to maximum, both included.
      present:
        description: The Entity has a Value with this key and recorded content.
      missing:
        description: The Entity has no Value with this key, or the Value has no recorded content.
  DuplicateHandling:
    permissible_values:
      distinct:
        description: Return each projected UUID once.
      preserve:
        description: Retain repeated projected UUIDs from distinct traversal paths.
