id: https://daniel-fink.github.io/rangekeeper/schema/duration
name: rangekeeper_duration
title: Rangekeeper Duration
version: 1.0.0
prefixes:
  linkml: https://w3id.org/linkml/
  rk: https://daniel-fink.github.io/rangekeeper/schema/
imports:
- common
default_prefix: rk
default_range: string
classes:
  Period:
    description: Half-open interval [start, end), which includes start and excludes end. Date boundaries use the Gregorian calendar; start must precede end.
    attributes:
      start:
        description: First date of the period; it is included.
        range: date
        required: true
      end:
        description: Boundary date after the period; it is excluded and later than start.
        range: date
        required: true
  Span:
    is_a: Period
    description: Named extent, using the same half-open boundary convention as Period.
    attributes:
      name:
        description: Optional name of the extent.
        range: string
enums:
  PeriodTiming:
    description: The date that represents a Period.
    permissible_values:
      first:
        description: The first day of the Period.
      last:
        description: The last day of the Period.
      end:
        description: The end boundary of the Period, the day after its last day.
  Never:
    description: The one word for an event that does not happen. NEVER is a date-valued result, not a
      missing value; an absent date is unresolved.
    permissible_values:
      never:
        description: The event does not happen. NEVER is later than every calendar date.
